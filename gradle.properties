# AGP 9 ships built-in Kotlin (2.2.10). This project uses it directly: no
# `org.jetbrains.kotlin.android` plugin, and all Kotlin plugins are pinned to 2.2.10
# so the Compose compiler plugin stays in lockstep with the compiler.

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37

kotlin.code.style=official
